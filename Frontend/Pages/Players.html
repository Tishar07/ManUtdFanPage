<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Frontend/Style/body.css">
    <link rel="stylesheet" href="/Frontend/Style/Navbar.css">
    <link rel="stylesheet" href="/Frontend/Style/Players.css">
    <link rel="icon" type="image/x-icon" href="/Frontend/Images/Favicon.png">
    <title>Players</title>
</head>
<body>
    <nav>
    <nav>
        <a href="/Frontend/Pages/index.html"><li>Home</li></a>
        <a href="/Frontend/Pages/Players.html"><li>Players</li></a>
        <a href=""><li>About Us</li></a>
    </nav>
    </nav>

    <div class="main-container">
        <div class="search-container">
            <input type="text" id="SearchPalyer">
            <button onclick="SearchValue()">Search</button>
        </div>

        <div class="options-container">
            
            <div class="sort-container">
                <label for="">Sort Options</label>
                <select name="ValueToSort" id="SortValue">
                    <option value="Age">Age</option>
                    <option value="Height">Height</option>
                    <option value="Salary">Salary</option>
                    <option value="Transfer Fee">Transfer Fee</option>
                </select>
                <label for="">Sort Order</label>
                <select name="Order" id="Order">
                    <option value="Ascending">Ascending</option>
                    <option value="Descending">Descending</option>
                </select>
            </div>

            <div class="attribute-container">
                <fieldset>
                    <Legend>Select Position</Legend>
                    <label for="">Goalkeeper</label>
                    <input type="checkbox" value="Goalkeeper">
                    
                    <label for="">Defender</label>
                    <input type="checkbox" value="Defender">

                    <label for="">Midfielder</label>
                    <input type="checkbox" value="Midfielder">

                    <label for="">Attacker</label>
                    <input type="checkbox" value="Attacker">
                </fieldset>
            </div>

            <div class="range-container">
                <label for="">Salary</label>
                <input type="range" id="SalaryRange" min="0" max="500000">
            </div>

        </div>

        <div class="player-container" id="player-container"></div>
    
    </div>

</body>

<script type="module" src="/Frontend/js/player.js"></script>

</html>
